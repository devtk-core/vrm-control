<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VRM Controller Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: sans-serif; }
        canvas { display: block; }
        
        /* 操作UI */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .btn-group { pointer-events: auto; display: flex; gap: 10px; }
        button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 12px;
            font-weight: bold;
            touch-action: manipulation;
            user-select: none;
            cursor: pointer;
        }
        button:active { background: rgba(255, 255, 255, 0.6); }
        #loading { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px; }
    </style>
</head>
<body>
    <div id="loading">Loading VRM...</div>

    <div id="controls">
        <div class="btn-group">
            <button id="btn-walk" ontouchstart="input.walk=true" ontouchend="input.walk=false" onmousedown="input.walk=true" onmouseup="input.walk=false">歩く</button>
            <button id="btn-dash" ontouchstart="input.dash=true" ontouchend="input.dash=false" onmousedown="input.dash=true" onmouseup="input.dash=false">走る</button>
        </div>
        <div class="btn-group">
            <button id="btn-jump" ontouchstart="doJump()" onmousedown="doJump()">跳ぶ</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // ==========================================
        //  1. 変数定義 (ここを一番最初に実行させる)
        // ==========================================
        
        // 時計を最優先で作成
        const clock = new THREE.Clock();

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        let currentVrm = null;
        
        const playerState = {
            position: new THREE.Vector3(0, 0, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            direction: new THREE.Vector3(0, 0, 1),
            onGround: true
        };
        
        window.input = { walk: false, dash: false };

        const CONFIG = {
            walkSpeed: 2.0,
            dashSpeed: 6.0,
            jumpPower: 5.0,
            gravity: 15.0
        };

        // ==========================================
        //  2. 関数定義
        // ==========================================

        function init() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene.background = new THREE.Color(0xa0a0a0);
            scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

            const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
            scene.add(grid);

            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);

            camera.position.set(0, 1.5, -3);

            loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');

            window.addEventListener('resize', onWindowResize);
            
            // 初期化が終わってからアニメーションを開始
            animate();
        }

        function loadVRM(url) {
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(
                url,
                (gltf) => {
                    const vrm = gltf.userData.vrm;
                    VRMUtils.removeUnnecessaryVertices(gltf.scene);
                    VRMUtils.combineSkeletons(gltf.scene);
                    
                    scene.add(vrm.scene);
                    currentVrm = vrm;
                    vrm.scene.rotation.y = Math.PI; 

                    console.log('VRM Loaded');
                    document.getElementById('loading').style.display = 'none';
                },
                (progress) => console.log('Loading...', 100.0 * (progress.loaded / progress.total) + '%'),
                (error) => console.error(error)
            );
        }

        window.doJump = function() {
            if (playerState.onGround) {
                playerState.velocity.y = CONFIG.jumpPower;
                playerState.onGround = false;
            }
        };

        function animate() {
            requestAnimationFrame(animate);

            // clockは一番上で作っているので、ここで確実に使えます
            const delta = clock.getDelta();

            if (currentVrm) {
                let speed = 0;
                if (window.input.dash) speed = CONFIG.dashSpeed;
                else if (window.input.walk) speed = CONFIG.walkSpeed;

                if (speed > 0) {
                    playerState.position.z += speed * delta;
                }

                playerState.velocity.y -= CONFIG.gravity * delta;
                playerState.position.y += playerState.velocity.y * delta;

                if (playerState.position.y <= 0) {
                    playerState.position.y = 0;
                    playerState.velocity.y = 0;
                    playerState.onGround = true;
                }

                currentVrm.scene.position.copy(playerState.position);
                currentVrm.update(delta);
                
                const cameraOffset = new THREE.Vector3(0, 1.5, -3.0); 
                const targetPosition = playerState.position.clone().add(cameraOffset);
                
                camera.position.lerp(targetPosition, 0.1);
                camera.lookAt(playerState.position.clone().add(new THREE.Vector3(0, 1.3, 0)));
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        //  3. 実行開始
        // ==========================================
        init();

    </script>
</body>
</html>
