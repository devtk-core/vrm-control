<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VRM Walking Demo (Debug)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: sans-serif; }
        canvas { display: block; }
        
        /* 操作UI */
        #controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .btn-group { pointer-events: auto; display: flex; gap: 10px; }
        button {
            background: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white;
            border-radius: 50%; width: 60px; height: 60px; font-size: 12px; font-weight: bold;
            touch-action: manipulation; user-select: none; cursor: pointer;
        }
        button:active { background: rgba(255, 255, 255, 0.6); }
        
        /* 読み込み・エラー表示用 */
        #status-board { 
            position: absolute; top: 10px; left: 10px; 
            color: white; background: rgba(0,0,0,0.7); padding: 10px; 
            pointer-events: none; max-width: 90%; word-wrap: break-word;
        }
        .error-msg { color: #ff5555; font-weight: bold; }
    </style>
</head>
<body>
    <div id="status-board">Initializing...</div>

    <div id="controls">
        <div class="btn-group">
            <button id="btn-walk" ontouchstart="startWalk()" ontouchend="stopWalk()" onmousedown="startWalk()" onmouseup="stopWalk()">歩く</button>
            <button id="btn-dash" ontouchstart="startDash()" ontouchend="stopDash()" onmousedown="startDash()" onmouseup="stopDash()">走る</button>
        </div>
        <div class="btn-group">
            <button id="btn-jump" ontouchstart="doJump()" onmousedown="doJump()">跳ぶ</button>
        </div>
    </div>

    <script>
        // エラーを画面に出すための仕掛け
        window.showError = function(msg) {
            const board = document.getElementById('status-board');
            board.innerHTML += '<br><span class="error-msg">Error: ' + msg + '</span>';
            console.error(msg);
        };
        window.logStatus = function(msg) {
            const board = document.getElementById('status-board');
            board.innerHTML = msg;
        };
        window.addEventListener('error', function(e) {
            window.showError(e.message);
        });
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        // ★修正: VRMHumanBoneName のインポートをやめて、エラーの可能性を減らす
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- 1. 初期化と変数 ---
        
        window.logStatus("Setting up Three.js...");

        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        let currentVrm = null;
        let swingTime = 0;
        
        const playerState = {
            position: new THREE.Vector3(0, 0, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: true
        };
        
        // 入力管理（関数経由に変更して安全性を向上）
        window.input = { walk: false, dash: false };
        window.startWalk = () => { window.input.walk = true; };
        window.stopWalk = () => { window.input.walk = false; };
        window.startDash = () => { window.input.dash = true; };
        window.stopDash = () => { window.input.dash = false; };

        const CONFIG = {
            walkSpeed: 2.0, dashSpeed: 6.0, jumpPower: 5.0, gravity: 15.0,
            walkSwingSpeed: 8.0, dashSwingSpeed: 15.0
        };

        // --- 2. メイン処理 ---

        function init() {
            try {
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                document.body.appendChild(renderer.domElement);

                scene.background = new THREE.Color(0xa0a0a0);
                scene.fog = new THREE.Fog(0xa0a0a0, 10, 50);

                // ライト・床
                const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
                scene.add(grid);
                const light = new THREE.DirectionalLight(0xffffff, 1.0);
                light.position.set(1, 1, 1).normalize();
                scene.add(light);
                scene.add(new THREE.AmbientLight(0x404040));

                camera.position.set(0, 1.5, -3);

                // モデル読み込み
                loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');

                window.addEventListener('resize', onWindowResize);
                
                // アニメーション開始
                animate();
            } catch (e) {
                window.showError(e);
            }
        }

        function loadVRM(url) {
            window.logStatus("Loading VRM Model...");
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(gltf.scene);
                
                scene.add(vrm.scene);
                currentVrm = vrm;
                vrm.scene.rotation.y = Math.PI; 

                window.logStatus("VRM Loaded! Ready.");
                
                // 初期の腕の位置を少し下げる
                resetPose();
            }, 
            (progress) => {
                window.logStatus("Loading: " + Math.round(100.0 * (progress.loaded / progress.total)) + "%");
            },
            (error) => {
                window.showError("Failed to load VRM: " + error);
            });
        }

        window.doJump = function() {
            if (playerState.onGround) {
                playerState.velocity.y = CONFIG.jumpPower;
                playerState.onGround = false;
            }
        };

        // アニメーション処理（文字列で骨を指定して安全に）
        function animateWalk(delta, speed) {
            if (!currentVrm || !currentVrm.humanoid) return;

            const swingSpeed = (speed >= CONFIG.dashSpeed) ? CONFIG.dashSwingSpeed : CONFIG.walkSwingSpeed;
            const swingMagnitude = (speed >= CONFIG.dashSpeed) ? 0.8 : 0.5;

            swingTime += delta * swingSpeed;

            const legAngle = Math.sin(swingTime) * swingMagnitude;
            const armAngle = Math.sin(swingTime + Math.PI) * swingMagnitude * 0.6;

            const humanoid = currentVrm.humanoid;
            
            // ★修正: ここを文字列リテラルに変更 ('leftUpperLeg' など)
            const leftLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
            const rightLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');
            const leftArm = humanoid.getNormalizedBoneNode('leftUpperArm');
            const rightArm = humanoid.getNormalizedBoneNode('rightUpperArm');

            if (leftLeg) leftLeg.rotation.x = legAngle;
            if (rightLeg) rightLeg.rotation.x = -legAngle;
            
            // 腕は基本の下げ角度(PI/2.5)に振りを加える
            if (leftArm) leftArm.rotation.set(armAngle, 0, Math.PI / 2.5); 
            if (rightArm) rightArm.rotation.set(-armAngle, 0, -Math.PI / 2.5);
        }

        function resetPose() {
            if (!currentVrm || !currentVrm.humanoid) return;
            const humanoid = currentVrm.humanoid;
            const leftArm = humanoid.getNormalizedBoneNode('leftUpperArm');
            const rightArm = humanoid.getNormalizedBoneNode('rightUpperArm');
            
            // 待機時は少し腕を下げる
            if (leftArm) leftArm.rotation.set(0, 0, Math.PI / 3.5);
            if (rightArm) rightArm.rotation.set(0, 0, -Math.PI / 3.5);
            
            // 足を戻す
            const leftLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
            const rightLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');
            if (leftLeg) leftLeg.rotation.x = 0;
            if (rightLeg) rightLeg.rotation.x = 0;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                let speed = 0;
                if (window.input.dash) speed = CONFIG.dashSpeed;
                else if (window.input.walk) speed = CONFIG.walkSpeed;

                if (speed > 0) {
                    playerState.position.z += speed * delta;
                    animateWalk(delta, speed);
                } else {
                    swingTime = 0;
                    resetPose();
                }

                playerState.velocity.y -= CONFIG.gravity * delta;
                playerState.position.y += playerState.velocity.y * delta;

                if (playerState.position.y <= 0) {
                    playerState.position.y = 0;
                    playerState.velocity.y = 0;
                    playerState.onGround = true;
                }

                currentVrm.scene.position.copy(playerState.position);
                currentVrm.update(delta);
                
                const targetPosition = playerState.position.clone().add(new THREE.Vector3(0, 1.5, -3.0));
                camera.position.lerp(targetPosition, 0.1);
                camera.lookAt(playerState.position.clone().add(new THREE.Vector3(0, 1.3, 0)));
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 実行
        init();
    </script>
</body>
</html>
