<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My VRM Dancer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: sans-serif; }
        
        /* ファイル選択ボタンのデザイン */
        #file-input { display: none; }
        #btn-upload {
            position: absolute; top: 20px; left: 20px;
            background: #444; color: white; padding: 10px 20px;
            border: 2px solid white; border-radius: 30px;
            cursor: pointer; font-weight: bold; z-index: 100;
        }
        #btn-upload:hover { background: #666; }

        #status-board { 
            position: absolute; top: 70px; left: 20px; 
            color: #00ff00; background: rgba(0,0,0,0.7); padding: 10px; 
            pointer-events: none; border-radius: 5px;
        }
    </style>
</head>
<body>
    <label id="btn-upload">
        📂 VRMを開く
        <input type="file" id="file-input" accept=".vrm">
    </label>

    <div id="status-board">Waiting for VRM...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- 初期設定 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, -3); // カメラ位置
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ライト
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(-1, 1, -1).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        let currentVrm = null;
        let mixer = null;
        const clock = new THREE.Clock();

        // アニメーションURL（サンバ）
        const ANIMATION_URL = 'https://threejs.org/examples/models/fbx/Samba Dancing.fbx';

        // --- ファイル読み込み処理 ---
        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const blobUrl = URL.createObjectURL(file); // ローカルファイルをURL化
            loadVRM(blobUrl);
        });

        // 初期モデル読み込み（最初はサンプルを表示）
        loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');

        function loadVRM(url) {
            const status = document.getElementById('status-board');
            status.innerHTML = "Loading VRM...";

            // 前のVRMがいれば消す
            if (currentVrm) {
                scene.remove(currentVrm.scene);
                VRMUtils.deepDispose(currentVrm.scene); // メモリ解放
                if(mixer) mixer.stopAllAction();
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; // こっち向く
                currentVrm = vrm;

                status.innerHTML = "VRM Loaded! Loading Dance...";

                // VRMが読み込めたら、サンバを読み込んで適用
                loadMixamoAnimation(ANIMATION_URL, vrm);

            }, (progress) => {
                status.innerHTML = "Loading: " + Math.round(100.0 * (progress.loaded / progress.total)) + "%";
            }, (error) => {
                status.innerHTML = "Error: " + error;
                console.error(error);
            });
        }

        function loadMixamoAnimation(url, vrm) {
            const status = document.getElementById('status-board');
            // アニメーションミキサー作成
            mixer = new THREE.AnimationMixer(vrm.scene);

            new FBXLoader().load(url, (asset) => {
                const clip = asset.animations[0];
                const tracks = [];

                // Mixamo -> VRM 骨変換マップ
                const mixamoMap = {
                    'mixamorigHips': 'hips', 'mixamorigSpine': 'spine', 'mixamorigSpine1': 'chest', 'mixamorigSpine2': 'upperChest',
                    'mixamorigNeck': 'neck', 'mixamorigHead': 'head',
                    'mixamorigLeftShoulder': 'leftShoulder', 'mixamorigLeftArm': 'leftUpperArm', 'mixamorigLeftForeArm': 'leftLowerArm', 'mixamorigLeftHand': 'leftHand',
                    'mixamorigRightShoulder': 'rightShoulder', 'mixamorigRightArm': 'rightUpperArm', 'mixamorigRightForeArm': 'rightLowerArm', 'mixamorigRightHand': 'rightHand',
                    'mixamorigLeftUpLeg': 'leftUpperLeg', 'mixamorigLeftLeg': 'leftLowerLeg', 'mixamorigLeftFoot': 'leftFoot', 'mixamorigLeftToeBase': 'leftToes',
                    'mixamorigRightUpLeg': 'rightUpperLeg', 'mixamorigRightLeg': 'rightLowerLeg', 'mixamorigRightFoot': 'rightFoot', 'mixamorigRightToeBase': 'rightToes'
                };

                clip.tracks.forEach((track) => {
                    const [bone, prop] = track.name.split('.');
                    const mixamoName = bone.replace('mixamorig', 'mixamorig'); // prefix処理
                    const vrmName = mixamoMap[mixamoName];
                    
                    if (vrmName) {
                        const vrmNode = vrm.humanoid.getNormalizedBoneNode(vrmName);
                        if (vrmNode) {
                            // ヒップ（腰）の移動データだけは、高さ以外消すと「その場で踊る」ようになる
                            // 今回はサンバなので、移動もそのままにしておきます（激しく動くため）
                            const t = track.clone();
                            t.name = `${vrmNode.name}.${prop}`;
                            tracks.push(t);
                        }
                    }
                });

                const action = mixer.clipAction(new THREE.AnimationClip('dance', clip.duration, tracks));
                action.play();
                status.innerHTML = "💃 Dancing! (Click button to change VRM)";

            }, undefined, (e) => console.error(e));
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (currentVrm) currentVrm.update(delta);
            if (mixer) mixer.update(delta);
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
