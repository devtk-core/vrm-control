<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VRM Ultimate Controller</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: sans-serif; }

        /* --- UIレイアウト --- */
        
        /* 1. 左上のファイル読み込みボタン */
        #file-ui {
            position: absolute; top: 20px; left: 20px;
            z-index: 1000; /* 最前面に表示 */
        }
        #btn-open {
            background: #444; color: white; padding: 12px 24px;
            border: 2px solid white; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #btn-open:hover { background: #666; transform: translateY(-2px); }
        #file-input { display: none; } /* 本体のinputは隠す */

        /* 2. ステータス表示 */
        #status-board { 
            position: absolute; top: 80px; left: 20px; 
            color: #00ff00; background: rgba(0,0,0,0.7); padding: 10px; 
            pointer-events: none; border-radius: 5px; font-family: monospace;
        }

        /* 3. 下部の操作ボタン群 */
        #controls {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .btn-group { pointer-events: auto; display: flex; gap: 15px; align-items: center; }
        
        /* ボタン共通デザイン */
        .control-btn {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid white; color: white;
            font-weight: bold; font-size: 13px; cursor: pointer;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.1s;
        }
        .control-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }

        /* 色分け */
        #btn-walk { background: rgba(0, 150, 255, 0.6); }
        #btn-dance { background: rgba(255, 50, 150, 0.6); }
        #btn-jump { background: rgba(50, 200, 50, 0.6); }

    </style>
</head>
<body>

    <div id="file-ui">
        <label id="btn-open">
            📂 VRMを開く
            <input type="file" id="file-input" accept=".vrm">
        </label>
    </div>

    <div id="status-board">System Ready</div>

    <div id="controls">
        <div class="btn-group">
            <div class="control-btn" id="btn-walk" 
                 ontouchstart="input.walk=true" ontouchend="input.walk=false" 
                 onmousedown="input.walk=true" onmouseup="input.walk=false">歩く</div>
            
            <div class="control-btn" id="btn-dance" 
                 ontouchstart="input.dance=true" ontouchend="input.dance=false" 
                 onmousedown="input.dance=true" onmouseup="input.dance=false">サンバ</div>
        </div>

        <div class="btn-group">
            <div class="control-btn" id="btn-jump" 
                 ontouchstart="doJump()" onmousedown="doJump()">跳ぶ</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // --- グローバル変数 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        const clock = new THREE.Clock();

        let currentVrm = null;
        let mixer = null;       // サンバ用ミキサー
        let sambaAction = null; // サンバのアクションデータ
        let swingTime = 0;      // 歩行アニメ用タイマー

        // プレイヤー状態
        const player = { pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(0, 0, 0), onGround: true };
        const config = { walkSpeed: 2.0, jumpPower: 5.0, gravity: 15.0 };
        
        // 入力状態
        window.input = { walk: false, dance: false };

        // ログ表示
        function log(msg) { document.getElementById('status-board').innerHTML = msg; }

        // --- 初期化 ---
        init();

        function init() {
            // レンダラー設定
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // シーン設定
            scene.background = new THREE.Color(0x333333);
            const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
            scene.add(grid);
            
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(-1, 1, -1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.set(0, 1.5, -3);

            // ファイル選択イベント
            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const blobUrl = URL.createObjectURL(file);
                    loadVRM(blobUrl);
                }
            });

            // 最初にサンプルモデルを読み込む
            loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');
            
            // リサイズ対応
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        // --- VRM読み込み ---
        function loadVRM(url) {
            log("Loading VRM...");
            
            // 古いモデルの削除
            if (currentVrm) {
                scene.remove(currentVrm.scene);
                VRMUtils.deepDispose(currentVrm.scene);
                if (mixer) mixer.stopAllAction();
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; // カメラの方を向く
                currentVrm = vrm;

                // アニメーションミキサー準備
                mixer = new THREE.AnimationMixer(currentVrm.scene);
                
                log("VRM Loaded! Loading Samba...");

                // サンバの動きをWebから取得して準備しておく
                loadSambaAnimation(vrm);

            }, 
            (progress) => log("Loading: " + Math.round(100.0 * (progress.loaded / progress.total)) + "%"),
            (error) => log("Error: " + error));
        }

        // --- サンバアニメーションの準備 (FBX Loader) ---
        function loadSambaAnimation(vrm) {
            const fbxUrl = 'https://threejs.org/examples/models/fbx/Samba Dancing.fbx';
            
            new FBXLoader().load(fbxUrl, (asset) => {
                const clip = asset.animations[0];
                const tracks = [];

                // Mixamoの骨 -> VRMの骨への変換マップ
                const boneMap = {
                    'mixamorigHips': 'hips', 'mixamorigSpine': 'spine', 'mixamorigSpine1': 'chest', 'mixamorigSpine2': 'upperChest',
                    'mixamorigNeck': 'neck', 'mixamorigHead': 'head',
                    'mixamorigLeftShoulder': 'leftShoulder', 'mixamorigLeftArm': 'leftUpperArm', 'mixamorigLeftForeArm': 'leftLowerArm', 'mixamorigLeftHand': 'leftHand',
                    'mixamorigRightShoulder': 'rightShoulder', 'mixamorigRightArm': 'rightUpperArm', 'mixamorigRightForeArm': 'rightLowerArm', 'mixamorigRightHand': 'rightHand',
                    'mixamorigLeftUpLeg': 'leftUpperLeg', 'mixamorigLeftLeg': 'leftLowerLeg', 'mixamorigLeftFoot': 'leftFoot', 'mixamorigLeftToeBase': 'leftToes',
                    'mixamorigRightUpLeg': 'rightUpperLeg', 'mixamorigRightLeg': 'rightLowerLeg', 'mixamorigRightFoot': 'rightFoot', 'mixamorigRightToeBase': 'rightToes'
                };

                clip.tracks.forEach((track) => {
                    const [boneName, prop] = track.name.split('.');
                    const simpleBoneName = boneName.replace('mixamorig', 'mixamorig');
                    const vrmBoneName = boneMap[simpleBoneName];

                    if (vrmBoneName) {
                        const vrmNode = vrm.humanoid.getNormalizedBoneNode(vrmBoneName);
                        if (vrmNode) {
                            const t = track.clone();
                            t.name = `${vrmNode.name}.${prop}`;
                            tracks.push(t);
                        }
                    }
                });

                const newClip = new THREE.AnimationClip('samba', clip.duration, tracks);
                sambaAction = mixer.clipAction(newClip);
                log("Ready! Push Buttons below.");

            }, undefined, (e) => console.error(e));
        }

        // --- アクション関数 ---
        window.doJump = function() {
            if (player.onGround) {
                player.vel.y = config.jumpPower;
                player.onGround = false;
            }
        };

        // プロシージャル歩行（計算で動かす）
        function animateProceduralWalk(delta) {
            if (!currentVrm) return;
            swingTime += delta * 10.0;
            const s = Math.sin(swingTime) * 0.5;
            const humanoid = currentVrm.humanoid;

            const lLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
            const rLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');
            const lArm = humanoid.getNormalizedBoneNode('leftUpperArm');
            const rArm = humanoid.getNormalizedBoneNode('rightUpperArm');

            if (lLeg) lLeg.rotation.x = s;
            if (rLeg) rLeg.rotation.x = -s;
            if (lArm) lArm.rotation.set(s * 0.5, 0, 1.2); // 腕は少し下ろして振る
            if (rArm) rArm.rotation.set(-s * 0.5, 0, -1.2);
        }

        function resetPose() {
            if (!currentVrm) return;
            const humanoid = currentVrm.humanoid;
            const lArm = humanoid.getNormalizedBoneNode('leftUpperArm');
            const rArm = humanoid.getNormalizedBoneNode('rightUpperArm');
            const lLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
            const rLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');

            // 基本姿勢に戻す
            if (lArm) lArm.rotation.set(0, 0, 1.3); // ハの字
            if (rArm) rArm.rotation.set(0, 0, -1.3);
            if (lLeg) lLeg.rotation.set(0, 0, 0);
            if (rLeg) rLeg.rotation.set(0, 0, 0);
        }

        // --- メインループ ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                // 1. サンバ（踊る）処理
                if (window.input.dance && mixer && sambaAction) {
                    if (!sambaAction.isRunning()) {
                        sambaAction.reset();
                        sambaAction.play();
                        sambaAction.fadeIn(0.2);
                    }
                    mixer.update(delta);
                
                // 2. 歩行処理
                } else if (window.input.walk) {
                    if (sambaAction && sambaAction.isRunning()) sambaAction.stop(); // ダンス中断
                    
                    player.pos.z += config.walkSpeed * delta;
                    animateProceduralWalk(delta); // 手足を振る
                
                // 3. 待機
                } else {
                    if (sambaAction && sambaAction.isRunning()) sambaAction.fadeOut(0.2);
                    mixer.update(delta); // フェードアウト用
                    resetPose(); // 手足を戻す
                }

                // 物理演算
                player.vel.y -= config.gravity * delta;
                player.pos.y += player.vel.y * delta;
                if (player.pos.y <= 0) {
                    player.pos.y = 0;
                    player.vel.y = 0;
                    player.onGround = true;
                }

                // 反映
                currentVrm.scene.position.copy(player.pos);
                currentVrm.update(delta);

                // カメラ追従
                const camTarget = player.pos.clone().add(new THREE.Vector3(0, 1.5, -3.0));
                camera.position.lerp(camTarget, 0.1);
                camera.lookAt(player.pos.clone().add(new THREE.Vector3(0, 1.3, 0)));
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
