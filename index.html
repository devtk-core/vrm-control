<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VRM Toggle Controller</title>
    <style>
        /* --- 画面固定設定 --- */
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100dvh;
            position: fixed; inset: 0;
            overflow: hidden; background-color: #333;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* --- UI --- */
        #file-ui {
            position: fixed; top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left)); z-index: 1000;
        }
        #btn-open {
            background: #444; color: white; padding: 10px 20px;
            border: 2px solid white; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        #file-input { display: none; }

        #status-board { 
            position: fixed;
            top: calc(max(20px, env(safe-area-inset-top)) + 50px);
            left: max(20px, env(safe-area-inset-left));
            color: #00ff00; background: rgba(0,0,0,0.6); padding: 8px; 
            pointer-events: none; border-radius: 5px; font-family: monospace; font-size: 12px;
        }

        #controls {
            position: fixed;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: max(20px, env(safe-area-inset-left));
            right: max(20px, env(safe-area-inset-right));
            display: flex; justify-content: space-between; pointer-events: auto;
        }
        .btn-group { display: flex; gap: 15px; }
        
        .control-btn {
            width: 65px; height: 65px; border-radius: 50%;
            border: 3px solid white; color: white;
            font-weight: bold; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            background: rgba(100, 100, 100, 0.5); /* 未選択状態 */
        }
        
        /* アクティブ時のスタイル */
        .active-walk { background: #0096ff !important; transform: scale(1.1); box-shadow: 0 0 15px #0096ff; }
        .active-dance { background: #ff3296 !important; transform: scale(1.1); box-shadow: 0 0 15px #ff3296; }
        
        /* ジャンプは押した時だけ */
        #btn-jump:active { background: #32c832; transform: scale(0.9); }

    </style>
</head>
<body>

    <div id="file-ui">
        <label id="btn-open">
            📂 VRM読込
            <input type="file" id="file-input" accept=".vrm">
        </label>
    </div>

    <div id="status-board">System Ready</div>

    <div id="controls">
        <div class="btn-group">
            <div class="control-btn" id="btn-walk" onclick="toggleMode('walk')">歩く</div>
            <div class="control-btn" id="btn-dance" onclick="toggleMode('dance')">サンバ</div>
        </div>

        <div class="btn-group">
            <div class="control-btn" id="btn-jump" 
                 ontouchstart="doJump(event)" onmousedown="doJump(event)">跳ぶ</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        const clock = new THREE.Clock();

        let currentVrm = null;
        let mixer = null;
        let sambaAction = null;
        let swingTime = 0;

        // 状態管理: 'idle' | 'walk' | 'dance'
        let currentMode = 'idle';

        const player = { pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(0, 0, 0), onGround: true };
        const config = { walkSpeed: 2.0, jumpPower: 5.0, gravity: 15.0 };

        function log(msg) { document.getElementById('status-board').innerText = msg; }

        // --- モード切替機能 ---
        window.toggleMode = (mode) => {
            const btnWalk = document.getElementById('btn-walk');
            const btnDance = document.getElementById('btn-dance');

            // 同じボタンを押したら停止(idle)
            if (currentMode === mode) {
                currentMode = 'idle';
                btnWalk.classList.remove('active-walk');
                btnDance.classList.remove('active-dance');
                // ダンス停止処理
                if (sambaAction) sambaAction.stop();
            } else {
                // 違うモードへ切り替え
                currentMode = mode;
                
                // UI更新
                btnWalk.classList.toggle('active-walk', mode === 'walk');
                btnDance.classList.toggle('active-dance', mode === 'dance');

                // ダンス開始・停止
                if (mode === 'dance') {
                    if (sambaAction) {
                        sambaAction.reset();
                        sambaAction.play();
                    }
                } else {
                    if (sambaAction) sambaAction.stop();
                }
            }
        };

        window.doJump = (e) => {
            if(e.cancelable) e.preventDefault();
            if (player.onGround) {
                player.vel.y = config.jumpPower;
                player.onGround = false;
            }
        };

        init();

        function init() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene.background = new THREE.Color(0x333333);
            const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
            scene.add(grid);
            
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(-1, 1, -1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x505050));

            camera.position.set(0, 1.4, -3.5);

            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadVRM(URL.createObjectURL(file));
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('dblclick', () => {
                camera.position.set(player.pos.x, player.pos.y + 1.4, player.pos.z - 3.5);
            });

            loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');
            
            animate();
        }

        function loadVRM(url) {
            log("Loading VRM...");
            if (currentVrm) {
                scene.remove(currentVrm.scene);
                VRMUtils.deepDispose(currentVrm.scene);
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; 
                currentVrm = vrm;
                mixer = new THREE.AnimationMixer(currentVrm.scene);
                
                applyStandPose();
                log("VRM Loaded. Loading Dance...");
                loadSamba();
            }, undefined, (e) => log("Error: " + e));
        }

        function loadSamba() {
            const url = 'https://threejs.org/examples/models/fbx/Samba Dancing.fbx';
            new FBXLoader().load(url, (asset) => {
                const clip = asset.animations[0];
                const tracks = [];
                const map = {
                    'mixamorigHips': 'hips', 'mixamorigSpine': 'spine', 'mixamorigSpine1': 'chest', 'mixamorigSpine2': 'upperChest',
                    'mixamorigNeck': 'neck', 'mixamorigHead': 'head',
                    'mixamorigLeftShoulder': 'leftShoulder', 'mixamorigLeftArm': 'leftUpperArm', 'mixamorigLeftForeArm': 'leftLowerArm', 
                    'mixamorigRightShoulder': 'rightShoulder', 'mixamorigRightArm': 'rightUpperArm', 'mixamorigRightForeArm': 'rightLowerArm', 
                    'mixamorigLeftUpLeg': 'leftUpperLeg', 'mixamorigLeftLeg': 'leftLowerLeg', 'mixamorigLeftFoot': 'leftFoot', 
                    'mixamorigRightUpLeg': 'rightUpperLeg', 'mixamorigRightLeg': 'rightLowerLeg', 'mixamorigRightFoot': 'rightFoot'
                };

                clip.tracks.forEach((track) => {
                    const [bone, prop] = track.name.split('.');
                    const simpleBone = bone.replace('mixamorig', 'mixamorig');
                    const vrmBone = map[simpleBone];
                    if (vrmBone) {
                        if (prop === 'scale' || prop === 'position') return; 
                        const vrmNode = currentVrm.humanoid.getNormalizedBoneNode(vrmBone);
                        if (vrmNode) {
                            const t = track.clone();
                            t.name = `${vrmNode.name}.${prop}`;
                            tracks.push(t);
                        }
                    }
                });
                sambaAction = mixer.clipAction(new THREE.AnimationClip('samba', clip.duration, tracks));
                log("Ready! Tap buttons.");
            });
        }

        function applyStandPose() {
            if (!currentVrm) return;
            const h = currentVrm.humanoid;
            const lArm = h.getNormalizedBoneNode('leftUpperArm');
            const rArm = h.getNormalizedBoneNode('rightUpperArm');
            const lLeg = h.getNormalizedBoneNode('leftUpperLeg');
            const rLeg = h.getNormalizedBoneNode('rightUpperLeg');

            // 待機ポーズ：腕を自然に下ろす(1.4)
            if(lArm) lArm.rotation.set(0, 0, 1.4);
            if(rArm) rArm.rotation.set(0, 0, -1.4);
            if(lLeg) lLeg.rotation.set(0, 0, 0);
            if(rLeg) rLeg.rotation.set(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                // --- モード別動作 ---
                if (currentMode === 'dance') {
                    // ダンスモード（操作なしで踊り続ける）
                    if (mixer && sambaAction) mixer.update(delta);
                
                } else if (currentMode === 'walk') {
                    // 歩行モード
                    player.pos.z += config.walkSpeed * delta;
                    
                    swingTime += delta * 10;
                    const s = Math.sin(swingTime) * 0.5;
                    const h = currentVrm.humanoid;
                    const lLeg = h.getNormalizedBoneNode('leftUpperLeg');
                    const rLeg = h.getNormalizedBoneNode('rightUpperLeg');
                    const lArm = h.getNormalizedBoneNode('leftUpperArm');
                    const rArm = h.getNormalizedBoneNode('rightUpperArm');
                    
                    if(lLeg) lLeg.rotation.set(s, 0, 0);
                    if(rLeg) rLeg.rotation.set(-s, 0, 0);
                    if(lArm) lArm.rotation.set(s*0.5, 0, 1.4);
                    if(rArm) rArm.rotation.set(-s*0.5, 0, -1.4);

                } else {
                    // アイドルモード（待機）
                    applyStandPose();
                }

                // 物理・座標
                player.vel.y -= config.gravity * delta;
                player.pos.y += player.vel.y * delta;
                if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; }

                currentVrm.scene.position.copy(player.pos);
                currentVrm.update(delta);

                // カメラ
                const target = player.pos.clone().add(new THREE.Vector3(0, 1.4, -3.5));
                camera.position.lerp(target, 0.1);
                camera.lookAt(player.pos.x, player.pos.y + 1.2, player.pos.z);
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
