<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VRM Final Perfect</title>
    <style>
        /* --- 画面全体設定 --- */
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden;
            background-color: #333;
            touch-action: none;
            position: fixed;
        }
        canvas { display: block; width: 100%; height: 100%; }

        /* --- UI (位置ズレ防止のFixed配置) --- */
        #file-ui {
            position: fixed;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            z-index: 1000;
        }
        #btn-open {
            background: #444; color: white; padding: 10px 20px;
            border: 2px solid white; border-radius: 30px;
            cursor: pointer; font-weight: bold; font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        #file-input { display: none; }

        #status-board { 
            position: fixed;
            top: calc(max(20px, env(safe-area-inset-top)) + 50px);
            left: max(20px, env(safe-area-inset-left));
            color: #00ff00; background: rgba(0,0,0,0.6); padding: 8px; 
            pointer-events: none; border-radius: 5px; font-family: monospace; font-size: 12px;
        }

        #controls {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: max(20px, env(safe-area-inset-left));
            right: max(20px, env(safe-area-inset-right));
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .btn-group { pointer-events: auto; display: flex; gap: 15px; }
        
        .control-btn {
            width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid white; color: white;
            font-weight: bold; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            user-select: none; -webkit-user-select: none;
        }
        .control-btn:active { transform: scale(0.9); opacity: 0.8; }

        #btn-walk { background: rgba(0, 150, 255, 0.8); }
        #btn-dance { background: rgba(255, 50, 150, 0.8); }
        #btn-jump { background: rgba(50, 200, 50, 0.8); }
    </style>
</head>
<body>

    <div id="file-ui">
        <label id="btn-open">
            📂 VRM読込
            <input type="file" id="file-input" accept=".vrm">
        </label>
    </div>

    <div id="status-board">System Ready</div>

    <div id="controls">
        <div class="btn-group">
            <div class="control-btn" id="btn-walk" 
                 ontouchstart="startWalk(event)" ontouchend="stopWalk(event)" 
                 onmousedown="startWalk(event)" onmouseup="stopWalk(event)">歩く</div>
            
            <div class="control-btn" id="btn-dance" 
                 ontouchstart="startDance(event)" ontouchend="stopDance(event)" 
                 onmousedown="startDance(event)" onmouseup="stopDance(event)">サンバ</div>
        </div>

        <div class="btn-group">
            <div class="control-btn" id="btn-jump" 
                 ontouchstart="doJump(event)" onmousedown="doJump(event)">跳ぶ</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        const clock = new THREE.Clock();

        let currentVrm = null;
        let mixer = null;
        let sambaAction = null;
        let swingTime = 0;

        const player = { pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(0, 0, 0), onGround: true };
        const config = { walkSpeed: 2.0, jumpPower: 5.0, gravity: 15.0 };
        const input = { walk: false, dance: false };

        function log(msg) { document.getElementById('status-board').innerText = msg; }

        // 操作イベント
        window.startWalk = (e) => { if(e.cancelable) e.preventDefault(); input.walk = true; };
        window.stopWalk = (e) => { if(e.cancelable) e.preventDefault(); input.walk = false; };
        window.startDance = (e) => { if(e.cancelable) e.preventDefault(); input.dance = true; };
        window.stopDance = (e) => { if(e.cancelable) e.preventDefault(); input.dance = false; };
        window.doJump = (e) => {
            if(e.cancelable) e.preventDefault();
            if (player.onGround) {
                player.vel.y = config.jumpPower;
                player.onGround = false;
            }
        };

        init();

        function init() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene.background = new THREE.Color(0x333333);
            const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
            scene.add(grid);
            
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(-1, 1, -1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x505050));

            camera.position.set(0, 1.4, -3.5);

            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadVRM(URL.createObjectURL(file));
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // カメラリセット
            document.addEventListener('dblclick', () => {
                camera.position.set(player.pos.x, player.pos.y + 1.4, player.pos.z - 3.5);
                camera.lookAt(player.pos.x, player.pos.y + 1.2, player.pos.z);
            });

            loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');
            
            animate();
        }

        function loadVRM(url) {
            log("Loading VRM...");
            if (currentVrm) {
                scene.remove(currentVrm.scene);
                VRMUtils.deepDispose(currentVrm.scene);
            }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                scene.add(vrm.scene);
                vrm.scene.rotation.y = Math.PI; 
                currentVrm = vrm;
                
                mixer = new THREE.AnimationMixer(currentVrm.scene);
                
                // ★重要: ロード直後にTポーズを強制適用
                resetPose();

                log("VRM Loaded. Loading Dance...");
                loadSamba();
            }, 
            undefined, 
            (e) => log("Error: " + e));
        }

        function loadSamba() {
            const url = 'https://threejs.org/examples/models/fbx/Samba Dancing.fbx';
            
            new FBXLoader().load(url, (asset) => {
                const clip = asset.animations[0];
                const tracks = [];
                
                const map = {
                    'mixamorigHips': 'hips', 'mixamorigSpine': 'spine', 'mixamorigSpine1': 'chest', 'mixamorigSpine2': 'upperChest',
                    'mixamorigNeck': 'neck', 'mixamorigHead': 'head',
                    'mixamorigLeftShoulder': 'leftShoulder', 'mixamorigLeftArm': 'leftUpperArm', 'mixamorigLeftForeArm': 'leftLowerArm', 
                    // Handマッピング削除（手首ねじれ防止）
                    'mixamorigRightShoulder': 'rightShoulder', 'mixamorigRightArm': 'rightUpperArm', 'mixamorigRightForeArm': 'rightLowerArm', 
                    'mixamorigLeftUpLeg': 'leftUpperLeg', 'mixamorigLeftLeg': 'leftLowerLeg', 'mixamorigLeftFoot': 'leftFoot', 
                    'mixamorigRightUpLeg': 'rightUpperLeg', 'mixamorigRightLeg': 'rightLowerLeg', 'mixamorigRightFoot': 'rightFoot'
                };

                clip.tracks.forEach((track) => {
                    const [bone, prop] = track.name.split('.');
                    const simpleBone = bone.replace('mixamorig', 'mixamorig');
                    const vrmBone = map[simpleBone];

                    if (vrmBone) {
                        if (prop === 'scale') return;
                        if (prop === 'position') return; 

                        const vrmNode = currentVrm.humanoid.getNormalizedBoneNode(vrmBone);
                        if (vrmNode) {
                            const t = track.clone();
                            t.name = `${vrmNode.name}.${prop}`;
                            tracks.push(t);
                        }
                    }
                });

                const newClip = new THREE.AnimationClip('samba', clip.duration, tracks);
                sambaAction = mixer.clipAction(newClip);
                log("Ready! Tap buttons.");
            });
        }

        // ★修正: Tポーズ(0,0,0)にリセットする関数
        function resetPose() {
            if (!currentVrm) return;
            const h = currentVrm.humanoid;
            const lArm = h.getNormalizedBoneNode('leftUpperArm');
            const rArm = h.getNormalizedBoneNode('rightUpperArm');
            const lLeg = h.getNormalizedBoneNode('leftUpperLeg');
            const rLeg = h.getNormalizedBoneNode('rightUpperLeg');

            // すべて 0,0,0 (T-Pose) にする
            if(lArm) lArm.rotation.set(0, 0, 0);
            if(rArm) rArm.rotation.set(0, 0, 0);
            if(lLeg) lLeg.rotation.set(0, 0, 0);
            if(rLeg) rLeg.rotation.set(0, 0, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                // 1. サンバ
                if (input.dance && mixer && sambaAction) {
                    if (!sambaAction.isRunning()) {
                        sambaAction.reset();
                        sambaAction.play();
                        sambaAction.fadeIn(0.2);
                    }
                    mixer.update(delta);
                
                // 2. 歩行
                } else if (input.walk) {
                    if (sambaAction && sambaAction.isRunning()) sambaAction.stop();
                    
                    player.pos.z += config.walkSpeed * delta;
                    
                    // 簡易歩行アニメ (Tポーズ基準で振る)
                    swingTime += delta * 10;
                    const s = Math.sin(swingTime) * 0.5;
                    const h = currentVrm.humanoid;
                    const lLeg = h.getNormalizedBoneNode('leftUpperLeg');
                    const rLeg = h.getNormalizedBoneNode('rightUpperLeg');
                    const lArm = h.getNormalizedBoneNode('leftUpperArm');
                    const rArm = h.getNormalizedBoneNode('rightUpperArm');
                    
                    if(lLeg) lLeg.rotation.set(s, 0, 0);
                    if(rLeg) rLeg.rotation.set(-s, 0, 0);
                    // 腕は少し下げた位置(1.2)を中心に振る
                    if(lArm) lArm.rotation.set(s*0.5, 0, 1.2);
                    if(rArm) rArm.rotation.set(-s*0.5, 0, -1.2);

                // 3. 待機
                } else {
                    if (sambaAction && sambaAction.isRunning()) sambaAction.fadeOut(0.2);
                    mixer.update(delta);
                    // 待機中はTポーズに戻す
                    resetPose();
                }

                // 物理と座標
                player.vel.y -= config.gravity * delta;
                player.pos.y += player.vel.y * delta;
                if (player.pos.y <= 0) { player.pos.y = 0; player.vel.y = 0; player.onGround = true; }

                currentVrm.scene.position.copy(player.pos);
                currentVrm.update(delta);

                // カメラ
                const target = player.pos.clone().add(new THREE.Vector3(0, 1.4, -3.5));
                camera.position.lerp(target, 0.1);
                camera.lookAt(player.pos.x, player.pos.y + 1.2, player.pos.z);
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
