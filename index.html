<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VRM Mixamo Loader</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; font-family: sans-serif; }
        canvas { display: block; }
        #controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; pointer-events: none;
        }
        .btn-group { pointer-events: auto; display: flex; gap: 10px; }
        button {
            background: rgba(255, 255, 255, 0.2); border: 2px solid white; color: white;
            border-radius: 50%; width: 60px; height: 60px; font-size: 12px; font-weight: bold;
            touch-action: manipulation; user-select: none; cursor: pointer;
        }
        button:active { background: rgba(255, 255, 255, 0.6); }
        #status-board { 
            position: absolute; top: 10px; left: 10px; 
            color: #00ff00; background: rgba(0,0,0,0.8); padding: 10px; 
            pointer-events: none; font-family: monospace; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="status-board">System Init...</div>
    <div id="controls">
        <div class="btn-group">
            <button onmousedown="input.walk=true" onmouseup="input.walk=false" ontouchstart="input.walk=true" ontouchend="input.walk=false">歩く</button>
        </div>
        <div class="btn-group">
            <button onmousedown="doJump()" ontouchstart="doJump()">跳ぶ</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.3.0/lib/three-vrm.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js'; // FBXLoaderを追加
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        function log(msg) {
            document.getElementById('status-board').innerHTML = msg;
            console.log(msg);
        }

        // --- 設定 ---
        const CONFIG = { walkSpeed: 2.0, jumpPower: 5.0, gravity: 15.0 };
        const clock = new THREE.Clock();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ antialias: true });

        let currentVrm = null;
        let mixer = null;
        let walkAction = null;

        // 物理状態
        const playerState = {
            position: new THREE.Vector3(0, 0, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            onGround: true
        };
        window.input = { walk: false };

        // --- Mixamoボーン名とVRMボーン名の対応表 ---
        const mixamoBoneMap = {
            'mixamorigHips': 'hips', 'mixamorigSpine': 'spine', 'mixamorigSpine1': 'chest', 'mixamorigSpine2': 'upperChest',
            'mixamorigNeck': 'neck', 'mixamorigHead': 'head',
            'mixamorigLeftShoulder': 'leftShoulder', 'mixamorigLeftArm': 'leftUpperArm', 'mixamorigLeftForeArm': 'leftLowerArm', 'mixamorigLeftHand': 'leftHand',
            'mixamorigRightShoulder': 'rightShoulder', 'mixamorigRightArm': 'rightUpperArm', 'mixamorigRightForeArm': 'rightLowerArm', 'mixamorigRightHand': 'rightHand',
            'mixamorigLeftUpLeg': 'leftUpperLeg', 'mixamorigLeftLeg': 'leftLowerLeg', 'mixamorigLeftFoot': 'leftFoot', 'mixamorigLeftToeBase': 'leftToes',
            'mixamorigRightUpLeg': 'rightUpperLeg', 'mixamorigRightLeg': 'rightLowerLeg', 'mixamorigRightFoot': 'rightFoot', 'mixamorigRightToeBase': 'rightToes'
        };

        function init() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            scene.background = new THREE.Color(0x333333);
            const grid = new THREE.GridHelper(50, 50, 0x888888, 0x444444);
            scene.add(grid);
            const light = new THREE.DirectionalLight(0xffffff, 1.0);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            camera.position.set(0, 1.5, -3);

            // 1. VRMモデル読み込み
            loadVRM('https://pixiv.github.io/three-vrm/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm');
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function loadVRM(url) {
            log("Loading VRM...");
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                VRMUtils.removeUnnecessaryVertices(gltf.scene);
                VRMUtils.combineSkeletons(gltf.scene);
                scene.add(vrm.scene);
                currentVrm = vrm;
                vrm.scene.rotation.y = Math.PI; 

                // アニメーションミキサー作成
                mixer = new THREE.AnimationMixer(currentVrm.scene);

                log("VRM Loaded. Loading FBX...");
                // 2. MixamoのFBXを読み込んで適用
                // loadMixamoAnimation('./walk.fbx', vrm);
                // テスト用に、Three.js公式のサンプルのURLを使ってみる
                loadMixamoAnimation('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/models/fbx/Samba Dancing.fbx', vrm);
            }, undefined, (e) => log("VRM Error: " + e));
        }

        // ★ FBX読み込み＆変換の魔法の関数
        function loadMixamoAnimation(url, vrm) {
            const loader = new FBXLoader();
            loader.load(url, (asset) => {
                const clip = asset.animations[0]; // 最初のアニメーションを取り出す
                if (!clip) { log("No animation in FBX"); return; }

                // トラック（骨の動きデータ）の名前をVRM用に書き換える
                const tracks = [];
                
                clip.tracks.forEach((track) => {
                    const trackSplitted = track.name.split('.');
                    const mixamoBoneName = trackSplitted[0].replace('mixamorig', 'mixamorig'); // 念のため
                    const propertyName = trackSplitted[1];

                    // Mixamoのボーン名からVRMのボーン名を取得
                    const vrmBoneName = mixamoBoneMap[mixamoBoneName] || mixamoBoneMap[mixamoBoneName.replace(':', '')]; // :ありなし両対応

                    if (vrmBoneName) {
                        // VRMモデル内の実際のオブジェクト名を探す
                        const vrmNode = vrm.humanoid.getNormalizedBoneNode(vrmBoneName);
                        if (vrmNode) {
                            // position(移動)はHips以外除外すると綺麗に動くことが多い
                            if (propertyName === 'position' && vrmBoneName !== 'hips') return;
                            
                            // Hipsの移動も、高さ(Y)以外は消さないと、勝手に歩いていってしまう（プログラムで動かすため）
                            if (vrmBoneName === 'hips' && propertyName === 'position') {
                                // 今回は簡易的に回転だけ適用する（その場足踏み化）ためpositionは全カットしてみる
                                return; 
                            }

                            // 新しい名前でトラックを作成
                            const newTrack = track.clone();
                            newTrack.name = `${vrmNode.name}.${propertyName}`;
                            tracks.push(newTrack);
                        }
                    }
                });

                const newClip = new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
                
                // アクション作成
                walkAction = mixer.clipAction(newClip);
                walkAction.stop();
                log("Ready! Press Walk.");

            }, undefined, (e) => log("FBX Error: " + e + "<br>Check file name 'walk.fbx'"));
        }

        window.doJump = function() {
            if (playerState.onGround) {
                playerState.velocity.y = CONFIG.jumpPower;
                playerState.onGround = false;
            }
        };

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (currentVrm) {
                // 移動処理
                const isWalking = window.input.walk;
                if (isWalking) {
                    playerState.position.z += CONFIG.walkSpeed * delta;
                }

                // アニメーション制御
                if (mixer && walkAction) {
                    if (isWalking) {
                        if (!walkAction.isRunning()) {
                            walkAction.play();
                            walkAction.fadeIn(0.2);
                        }
                    } else {
                        if (walkAction.isRunning()) {
                            walkAction.fadeOut(0.2);
                        }
                    }
                    mixer.update(delta);
                }

                // 物理
                playerState.velocity.y -= CONFIG.gravity * delta;
                playerState.position.y += playerState.velocity.y * delta;
                if (playerState.position.y <= 0) {
                    playerState.position.y = 0;
                    playerState.velocity.y = 0;
                    playerState.onGround = true;
                }
                currentVrm.scene.position.copy(playerState.position);
                currentVrm.update(delta);
                
                // カメラ
                const targetPos = playerState.position.clone().add(new THREE.Vector3(0, 1.5, -3.0));
                camera.position.lerp(targetPos, 0.1);
                camera.lookAt(playerState.position.clone().add(new THREE.Vector3(0, 1.3, 0)));
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
